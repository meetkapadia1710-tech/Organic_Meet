<!-- Applied before first paint so a dark-theme visitor never sees a light
     flash. Mirrors the static site's inline head script. -->
<script>
(function () {
  var r = document.documentElement;
  r.classList.add('js');
  try {
    if (sessionStorage.getItem('mk-visited')) r.classList.add('seen');
    else sessionStorage.setItem('mk-visited', '1');
  } catch (e) {}
  try {
    var t = localStorage.getItem('mk-theme');
    if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if (t) r.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/main.tsx"></script>
</body>
</html>
